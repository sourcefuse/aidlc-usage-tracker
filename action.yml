name: AI-DLC Usage Report
description: Team adoption and token/cost reports from the AWS AI-DLC audit records committed to your repository.
author: SourceFuse
branding:
  icon: bar-chart-2
  color: blue

inputs:
  path:
    description: Path to the checked-out AI-DLC repository. Check it out with fetch-depth 0 so authors can be attributed.
    required: false
    default: "."
  since:
    description: Start of the activity period, as "<n>d" (e.g. 30d) or an ISO date.
    required: false
    default: "30d"
  roster:
    description: Team roster JSON. Defaults to <path>/.aidlc-usage/team.json when that file exists.
    required: false
    default: ""
  output-dir:
    description: Where to write the reports. Defaults to a directory under RUNNER_TEMP, outside the checkout.
    required: false
    default: ""
  upload-artifact:
    description: Upload the reports as a workflow artifact ("true" or "false").
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: aidlc-usage-report
  retention-days:
    description: Artifact retention in days (subject to repository and organisation limits).
    required: false
    default: "90"

outputs:
  report-dir:
    description: Directory containing usage-report.json and the CSV reports.
    value: ${{ steps.report.outputs.dir }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        package-manager-cache: false

    - name: Generate report
      id: report
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SINCE: ${{ inputs.since }}
        INPUT_ROSTER: ${{ inputs.roster }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
      # Node's permission model confines the reporter: it can read only its own source, the
      # repository (and the roster, if given) and can write only to the output directory.
      # Child processes are allowed solely for the read-only `git log` used for attribution.
      run: |
        set -euo pipefail
        repo="$(cd "$INPUT_PATH" && pwd -P)"
        out="${INPUT_OUTPUT_DIR:-$RUNNER_TEMP/aidlc-usage-report}"
        mkdir -p "$out" && out="$(cd "$out" && pwd -P)"
        src="$(cd "$GITHUB_ACTION_PATH/src" && pwd -P)"
        perms=(--permission "--allow-fs-read=$src" "--allow-fs-read=$repo" "--allow-fs-read=$out" "--allow-fs-write=$out" --allow-child-process)
        args=(--repo "$repo" --since "$INPUT_SINCE" --out "$out")
        if [[ -n "$INPUT_ROSTER" ]]; then
          roster="$(cd "$(dirname "$INPUT_ROSTER")" && pwd -P)/$(basename "$INPUT_ROSTER")"
          perms+=("--allow-fs-read=$roster")
          args+=(--roster "$roster")
        fi
        node "${perms[@]}" "$src/cli.ts" "${args[@]}"
        echo "dir=$out" >> "$GITHUB_OUTPUT"

    - name: Upload report artifact
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.report.outputs.dir }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
