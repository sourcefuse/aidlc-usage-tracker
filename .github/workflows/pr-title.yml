# PRs are squash-merged and the PR title becomes the commit on main, so the title must follow
# Conventional Commits. Keep `types` in sync with commitlint.config.mjs (used by the local
# husky commit-msg hook).
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # read the PR title
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject "{subject}" must start with a lowercase letter.
