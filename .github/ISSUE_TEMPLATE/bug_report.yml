name: Bug report
description: Something in the report is wrong or the action fails.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste real audit records, emails, prompts or report files. Describe the shape of the data instead, or build a minimal synthetic example.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally a minimal synthetic audit file that shows the problem.
  - type: input
    id: tracker-version
    attributes:
      label: aidlc-usage-tracker version or commit
    validations:
      required: true
  - type: input
    id: aidlc-version
    attributes:
      label: AWS AI-DLC version
      placeholder: e.g. 2.11.1
    validations:
      required: true
  - type: dropdown
    id: merge
    attributes:
      label: How are PRs merged in your AI-DLC repository?
      options: [Squash, Merge commit, Rebase, Mixed, Not sure]
