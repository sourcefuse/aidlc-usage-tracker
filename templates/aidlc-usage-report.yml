# Copy to .github/workflows/aidlc-usage-report.yml in your project's AI-DLC repository.
# It reads the AI-DLC audit records merged to main and uploads CSV + JSON reports as a
# workflow artifact. Nothing is committed back to the repository.
name: AI-DLC usage report

on:
  # Report whenever something the report reads lands on main: the intent registry, AI-DLC
  # audit files (intent-level and space-level) or the roster. Knowledge base, codekb, memory
  # and stage artifacts never change the report, so they don't trigger it.
  push:
    branches: [main]
    paths:
      - "aidlc/spaces/*/intents/intents.json"
      - "aidlc/spaces/*/intents/**/audit/*.md"
      - ".aidlc-usage/team.json"
  # Run on demand from the Actions tab.
  workflow_dispatch:
  # Optional: a weekly snapshot even in quiet weeks, e.g. for a Monday review.
  # schedule:
  #   - cron: "0 2 * * 1" # Mondays, 02:00 UTC

permissions: {}

concurrency:
  group: aidlc-usage-report
  cancel-in-progress: true

jobs:
  report:
    name: Generate usage report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # full history is needed to attribute audit files to developers
          persist-credentials: false
      # Pinned to the full commit SHA of a release for supply-chain safety. Enable Dependabot
      # for github-actions in this repository to receive PRs when a new release is out.
      - uses: sourcefuse/aidlc-usage-tracker@ba3c481053062d78f44ffcdd2b8f587dc2661983 # v0.1.0
        with:
          since: 30d
          # roster: .aidlc-usage/team.json   # default location; see examples/team.json
          # retention-days: "90"
